[package]
name = "openpods"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native, local AirPods monitoring for CachyOS"
repository = "https://github.com/MarexMB/OpenPods"

[features]
default = ["gui"]
gui = ["dep:adw"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures-util = "0.3"
adw = { package = "libadwaita", version = "0.9", optional = true, features = ["v1_4"] }

[profile.release]
lto = "thin"
strip = true

